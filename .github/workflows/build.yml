name: Build OpenWrt APKs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"
      - "ci/**"
      - "install.sh"
      - "luci-app-xray-mitm/**"
      - "scripts/**"
      - "tests/**"
      - "xray-mitm/**"
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - "ci/**"
      - "install.sh"
      - "luci-app-xray-mitm/**"
      - "scripts/**"
      - "tests/**"
      - "xray-mitm/**"
  workflow_dispatch:
    inputs:
      openwrt_release:
        description: Official OpenWrt SDK release
        required: true
        default: "25.12.5"
        type: string
      sdk_arch:
        description: Official SDK package architecture
        required: true
        default: aarch64_generic
        type: string

permissions:
  contents: read

concurrency:
  # A newer candidate supersedes older artifacts; stale runs must not be used.
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENWRT_RELEASE: ${{ inputs.openwrt_release || '25.12.5' }}
  SDK_ARCH: ${{ inputs.sdk_arch || 'aarch64_generic' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    # The exact-head checker runs the repository suite and writes a bounded
    # evidence file; leave headroom for slow hosted runners.
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run exact-candidate checks and emit evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECK_PR_ALLOW_MANUAL_GATES: "1"
          PR_EVIDENCE_PATH: ${{ runner.temp }}/pr-evidence.json
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            sh scripts/validate-release.sh
          else
            sh scripts/check-pr.sh "$BASE_SHA" "$CANDIDATE_SHA"
          fi

      - name: Preserve source evidence for the package build job
        if: always() && github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-evidence-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-evidence.json
          if-no-files-found: error
          retention-days: 1

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download exact-candidate source evidence
        if: github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-evidence-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-evidence

      - name: Build noarch packages with the official OpenWrt SDK
        uses: openwrt/gh-action-sdk@7fc2640243284ecc44f4a9c3f749a61746ee02cb # v11
        env:
          ARCH: ${{ env.SDK_ARCH }}-${{ env.OPENWRT_RELEASE }}
          BUILD_LOG: "1"
          FEEDNAME: xray_mitm
          INDEX: "1"
          PACKAGES: xray-mitm luci-app-xray-mitm
          V: s

      - name: Collect packages and checksums
        shell: bash
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t indexes < <(find bin -type f -path '*/xray_mitm/packages.adb' | LC_ALL=C sort)
          find bin -type f -name 'xray-mitm-*.apk' -exec cp '{}' dist/ \;
          find bin -type f -name 'luci-app-xray-mitm-*.apk' -exec cp '{}' dist/ \;
          test "${#indexes[@]}" -eq 1
          cp "${indexes[0]}" dist/packages.adb
          cp LICENSE README.md README.fa.md THIRD_PARTY_NOTICES.md install.sh dist/
          source_commit="$(git rev-parse HEAD)"
          printf '%s\n' "$source_commit" > dist/SOURCE_COMMIT
          printf '%s\n' "$OPENWRT_RELEASE" > dist/OPENWRT_RELEASE
          printf '%s\n' "$SDK_ARCH" > dist/SDK_ARCH
          printf '%s\n' apk > dist/PACKAGE_FORMAT
          printf '%s\n' 'promotable unsigned APK bundle' > dist/ARTIFACT_PURPOSE
          printf '%s\n' "$GITHUB_RUN_ID" > dist/BUILD_RUN_ID
          printf '%s\n' "$GITHUB_WORKFLOW" > dist/BUILD_WORKFLOW
          printf '%s\n' "$GITHUB_EVENT_NAME" > dist/BUILD_EVENT
          if [ -n "$BASE_COMMIT" ]; then
            printf '%s\n' "$BASE_COMMIT" > dist/BASE_COMMIT
          fi
          if [ -n "$PR_NUMBER" ]; then
            printf '%s\n' "$PR_NUMBER" > dist/PR_NUMBER
          fi

          test "$(find dist -maxdepth 1 -type f -name 'xray-mitm-*.apk' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name 'luci-app-xray-mitm-*.apk' | wc -l)" -eq 1

          cd dist
          find . -maxdepth 1 -type f -name '*.apk' -print \
            | LC_ALL=C sort \
            | sed 's#^./##' \
            | xargs sha256sum > PACKAGE_SHA256SUMS
          find . -maxdepth 1 -type f -name '*.apk' -print \
            | LC_ALL=C sort \
            | sed 's#^./##' \
            | xargs sha256sum > SHA256SUMS
          sha256sum packages.adb >> SHA256SUMS
          find . -maxdepth 1 -type f -name '*.apk' -print \
            | LC_ALL=C sort \
            | sed 's#^./##' > PACKAGES
          sha256sum -c PACKAGE_SHA256SUMS
          sha256sum -c SHA256SUMS
          cd ..
          sh scripts/verify-promotion-artifact.sh dist "$source_commit" "$OPENWRT_RELEASE" "$SDK_ARCH"

      - name: Bind package checksums to the exact-candidate evidence
        if: github.event_name != 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          python3 scripts/pr-evidence.py attach-build \
            --repo "$GITHUB_WORKSPACE" \
            --evidence "$RUNNER_TEMP/pr-evidence/pr-evidence.json" \
            --artifact-dir dist \
            --source-sha "$CANDIDATE_SHA" \
            --format apk \
            --release "$OPENWRT_RELEASE" \
            --architecture "$SDK_ARCH" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --sdk-action "openwrt/gh-action-sdk@7fc2640243284ecc44f4a9c3f749a61746ee02cb" \
            --checksum-command "sha256sum -c PACKAGE_SHA256SUMS && sha256sum -c SHA256SUMS"

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xray-mitm-openwrt-${{ env.OPENWRT_RELEASE }}-${{ env.SDK_ARCH }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact-candidate PR evidence
        if: github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-evidence-apk-${{ env.OPENWRT_RELEASE }}-${{ env.SDK_ARCH }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/pr-evidence/pr-evidence.json
          if-no-files-found: error
          retention-days: 30
