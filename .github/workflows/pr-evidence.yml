name: PR Evidence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

jobs:
  evidence:
    name: PR validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact pull-request candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run change-aware checks and write versioned evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          CHECK_PR_ALLOW_MANUAL_GATES: "1"
          PR_EVIDENCE_PATH: ${{ runner.temp }}/pr-evidence.json
        run: |
          set -eu
          # Never consume a committed or earlier-run evidence file.
          rm -f "$PR_EVIDENCE_PATH"
          sh scripts/check-pr.sh "$BASE_SHA" "$CANDIDATE_SHA"
          python3 scripts/pr-evidence.py verify-source \
            --repo "$GITHUB_WORKSPACE" --evidence "$PR_EVIDENCE_PATH" \
            --base-sha "$BASE_SHA" --candidate-sha "$CANDIDATE_SHA"

      - name: Upload exact-candidate PR evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-evidence-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-evidence.json
          if-no-files-found: error
          retention-days: 30
